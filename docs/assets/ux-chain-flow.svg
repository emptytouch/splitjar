<svg viewBox="0 0 680 620" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img">
  <title>SplitJar 产品完整链路流程图（前端 UX 视角 · 两 actor 模型）</title>
  <desc>两条泳道：人类用户（同一钱包，含创作/卖 与 购买/买 两个上下文）、机器买家 Agent（独立程序）。红虚线为前端 UX 断点 G1-G5</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="28" fill="#1f2937" font-size="14" font-weight="500">SplitJar · 产品完整链路（前端 UX 视角 · 两 actor）</text>

  <!-- ===== 泳道 A：人类用户（买 + 卖，同一钱包） ===== -->
  <rect x="40" y="48" width="600" height="356" rx="12" fill="#F7F8FA" stroke="#C9CED6" stroke-width="1"/>
  <rect x="48" y="56" width="220" height="22" rx="11" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="158" y="70" text-anchor="middle" fill="#185FA5" font-size="12" font-weight="500">① 人类用户（同一钱包：买 + 卖）</text>
  <text x="300" y="70" fill="#5b6675" font-size="11">既是创作者，也是买家</text>

  <!-- 子上下文 A1：创作 / 卖 -->
  <text x="56" y="100" fill="#185FA5" font-size="11" font-weight="500">创作上下文（卖）</text>
  <g>
    <rect x="120" y="110" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="205" y="132" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500" dominant-baseline="central">/create</text>
    <text x="205" y="150" text-anchor="middle" fill="#5b6675" font-size="12" dominant-baseline="central">选文件·标题·定价·分账</text>
  </g>
  <g>
    <rect x="312" y="110" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="387" y="132" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500" dominant-baseline="central">上传 + 上链</text>
    <text x="387" y="150" text-anchor="middle" fill="#5b6675" font-size="12" dominant-baseline="central">Blob私有·指纹上链</text>
  </g>
  <g>
    <rect x="484" y="110" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="559" y="132" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500" dominant-baseline="central">/dashboard</text>
    <text x="559" y="150" text-anchor="middle" fill="#5b6675" font-size="12" dominant-baseline="central">收入·销量·下架·提现</text>
  </g>
  <g>
    <rect x="484" y="176" width="160" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="564" y="197" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">分享链接 + 二维码</text>
  </g>
  <g>
    <rect x="120" y="176" width="170" height="42" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="205" y="193" text-anchor="middle" fill="#791F1F" font-size="12" font-weight="500" dominant-baseline="central">缺描述 / 预览图</text>
    <text x="205" y="209" text-anchor="middle" fill="#A32D2D" font-size="11" dominant-baseline="central">G3 创作者侧</text>
  </g>
  <line x1="290" y1="138" x2="310" y2="138" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="462" y1="138" x2="482" y2="138" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="559" y1="166" x2="559" y2="174" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 子上下文 A2：购买 / 买 -->
  <text x="56" y="246" fill="#3B6D11" font-size="11" font-weight="500">购买上下文（买）</text>
  <g>
    <rect x="120" y="256" width="150" height="54" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="195" y="274" text-anchor="middle" fill="#791F1F" font-size="13" font-weight="500" dominant-baseline="central">发现 ?</text>
    <text x="195" y="292" text-anchor="middle" fill="#A32D2D" font-size="11" dominant-baseline="central">无 /explore (G4)</text>
  </g>
  <g>
    <rect x="288" y="256" width="170" height="54" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="373" y="274" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500" dominant-baseline="central">/p/:id 决策页</text>
    <text x="373" y="292" text-anchor="middle" fill="#5b6675" font-size="11" dominant-baseline="central">缺信任信号 (G2)</text>
  </g>
  <g>
    <rect x="478" y="256" width="140" height="54" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="548" y="283" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">钱包签名付款</text>
  </g>
  <g>
    <rect x="478" y="320" width="150" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="553" y="342" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">60s 直链下载</text>
  </g>
  <g>
    <rect x="288" y="320" width="170" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="373" y="336" text-anchor="middle" fill="#791F1F" font-size="13" font-weight="500" dominant-baseline="central">我的已购 ?</text>
    <text x="373" y="352" text-anchor="middle" fill="#A32D2D" font-size="11" dominant-baseline="central">无 /library (G1)</text>
  </g>
  <line x1="270" y1="283" x2="286" y2="283" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="283" x2="476" y2="283" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="548" y1="310" x2="548" y2="318" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="342" x2="460" y2="342" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 同钱包纵向连接：创作子上下文 ↔ 购买子上下文 -->
  <line x1="104" y1="138" x2="104" y2="283" stroke="#8A909C" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="104" y="214" text-anchor="middle" fill="#8A909C" font-size="10" transform="rotate(-90 104 214)">同一钱包地址</text>

  <!-- 跨子上下文：分享 → 发现 -->
  <path d="M644 197 C668 235 200 245 122 278" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="370" y="238" text-anchor="middle" fill="#A32D2D" font-size="11">分享链接 / 二维码（买家当前唯一发现源）</text>

  <!-- ===== 泳道 B：机器买家 Agent（独立程序） ===== -->
  <rect x="40" y="424" width="600" height="140" rx="12" fill="#F7F8FA" stroke="#C9CED6" stroke-width="1"/>
  <rect x="48" y="432" width="232" height="22" rx="11" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="164" y="446" text-anchor="middle" fill="#534AB7" font-size="12" font-weight="500">② 机器买家 Agent（独立程序）</text>

  <g>
    <rect x="120" y="464" width="170" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="205" y="482" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">GET /api/catalog</text>
    <text x="205" y="500" text-anchor="middle" fill="#5b6675" font-size="11" dominant-baseline="central">目录·标题·预览·价</text>
  </g>
  <g>
    <rect x="302" y="464" width="130" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="367" y="489" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">402 + 报价</text>
  </g>
  <g>
    <rect x="444" y="464" width="120" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="504" y="489" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">pay() 上链</text>
  </g>
  <g>
    <rect x="444" y="528" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="524" y="544" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500" dominant-baseline="central">X-Payment 重试</text>
    <text x="524" y="560" text-anchor="middle" fill="#5b6675" font-size="11" dominant-baseline="central">→ 200 直链</text>
  </g>
  <g>
    <rect x="120" y="528" width="180" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
    <text x="210" y="544" text-anchor="middle" fill="#791F1F" font-size="12" font-weight="500" dominant-baseline="central">catalog 缺描述/销量</text>
    <text x="210" y="560" text-anchor="middle" fill="#A32D2D" font-size="11" dominant-baseline="central">G5 数据源</text>
  </g>
  <line x1="290" y1="489" x2="300" y2="489" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="432" y1="489" x2="442" y2="489" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="504" y1="514" x2="504" y2="526" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 共用合约说明 -->
  <text x="340" y="412" text-anchor="middle" fill="#5b6675" font-size="12">人类用户 与 机器买家 共用 pay() / PaymentSplit（msg.sender = 买家本人）</text>

  <!-- 图例 -->
  <rect x="120" y="588" width="18" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="146" y="600" fill="#5b6675" font-size="12">已落地（功能闭环）</text>
  <rect x="300" y="588" width="18" height="14" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="326" y="600" fill="#5b6675" font-size="12">缺失断点（UX 缺口 G1-G5）</text>
</svg>
